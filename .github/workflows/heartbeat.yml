name: Heartbeat
on:
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Update heartbeat
        run: |
          SUMMARY=$(python - <<'PY'
          import trustpilot_faq as tf
          top = tf.popular(1)[0]
          print(f"FAQs in database: {len(tf.FAQ)}")
          print(f"Most asked question: {top['question']} ({top['popularity']}%)")
          PY
          )
          {
            echo "BHMarketer Trustpilot Removal FAQ Generator heartbeat"
            echo "Last update: $(date -u +%Y-%m-%d)"
            echo "$SUMMARY"
          } > heartbeat.txt
          cat heartbeat.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git diff --cached --quiet || git commit -m "chore: heartbeat update $(date -u +%Y-%m-%d)"
          git push
